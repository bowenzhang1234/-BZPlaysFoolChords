# Custom sound pack. Set instrument = custom in chords.cfg, then restart.
# Put 16-bit wav files in this folder. Use file names only, not paths.
# This file is not JSON because the game reads every .json under mods\ as a mod manifest.

# Cycle these when the played card has no line of its own.
# files = my-chord.wav | another-chord.wav

# One card id per line. Several files separated by | take turns each time that card plays.
# card.WAH_CHO_KI = wah-cho-ki.wav
# card.WAH_HAMMER = hit-1.wav | hit-2.wav
