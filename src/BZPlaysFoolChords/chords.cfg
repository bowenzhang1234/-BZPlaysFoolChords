# BZ Plays Fool Chords
# Restart the game after editing this file. It sits next to BZPlaysFoolChords.dll.
# Do not rename this file to .json. The game treats every .json file under mods\ as a mod manifest.

# replace: the new sound takes the place of the Wah / Cho / Ki voice.
# alongside: the new sound plays in addition to that voice.
mode = replace

# Sound source. piano is the built-in synth. samples plays wav/ogg files from the samples folder.
# samples = audio/samples
instrument = piano

# How a syllable becomes a chord. per-syllable, loop, random, or per-card.
mapping = per-syllable

# Per syllable. These are the defaults. A compound card plays each one in order.
syllable.wah = C
syllable.cho = G
syllable.ki = Am

# Card ids that should trigger a sound. Leave this blank for every Fool melody voice.
# cardIds = WAH_CHO_KI
cardIds =

# Multiplier on top of the Master and SFX sliders. Try 2 or 4 if the sound is quieter than the game.
volume = 1.0

# --- Other mapping examples. Use one mapping at a time. ---
# mapping = loop
# progression = C | G | Am | F
#
# mapping = random
# pool = C | G | Am | F
#
# mapping = per-card
# card.WAH_CHO_KI = C | G | Am
# card.WAH_HAMMER = C
# type.Attack = F
# fallback = Am
#
# A chord can also be written as notes: C:C4,E4,G4
