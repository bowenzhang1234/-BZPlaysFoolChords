# BZ Plays Fool Chords
# Restart the game after editing this file. It sits next to BZPlaysFoolChords.dll.
# Do not rename this file to .json. The game treats every .json file under mods\ as a mod manifest.

# replace: the chord takes the place of the Wah / Cho / Ki voice.
# alongside: the chord plays in addition to that voice.
mode = replace

# piano, acoustic (regular guitar), electric, jazz, drums, custom.
# Jazz uses maj7 / min9 voicings. Drums play a short groove instead of a chord.
# custom plays wav files you add under audio\custom\ (see pack.cfg there).
# Restart after changing this. Names also accepted: guitar, rhodes, electric guitar, drum kit.
instrument = piano

# Card ids that should trigger a chord. Leave this blank to chord every Fool melody voice.
# Wah Cho Ki is the card that sings all three voices. Example for that card only:
# cardIds = WAH_CHO_KI
cardIds =

# Extra Wah / Cho / Ki syllables from the same card, inside this many milliseconds, stay on the same chord.
debounceMs = 1100

# Multiplier on top of the Master and SFX sliders. Try 2 or 4 if the chord is quieter than the game.
volume = 1.0

# Cycle. Separate steps with |. A wav name is loaded from audio\<instrument>\.
# Note lists are played on the selected instrument instead of the built-in voicing.
# Drums ignore the note names and cycle backbeat, push, hats, fill with each step.
# Note examples: C:C4,E4,G4 | G:G3,B3,D4 | Am:A3,C4,E4 | Dm:D4,F4,A4
progression = C.wav | G.wav | Am.wav | F.wav
